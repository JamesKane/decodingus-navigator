[package]
name = "navigator-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Application/command layer: orchestrates store + analysis + sync behind a command
# API the UI dispatches to. No UI, no domain decisions in widgets.
[dependencies]
navigator-domain = { workspace = true }
navigator-store = { workspace = true }
navigator-analysis = { workspace = true }
# Stage B of the realignment module (design/realignment-module.md). Its own crate so the optional
# C FFI backend cannot affect this one's build.
navigator-align = { workspace = true }
# The realignment job's resource watch. Depended on directly rather than reached through
# `navigator-analysis`, because the writers it accounts for live in both that crate and
# `navigator-align`, and neither is the owner.
navigator-resource = { workspace = true }
navigator-sync = { workspace = true }
navigator-refgenome = { workspace = true }
du-domain = { workspace = true }
# Verify peer device-key (did:key) signatures on IBD attestations — same code the AppView runs.
du-atproto = { workspace = true }
# Shared SHA-256 helpers (content hashing of imported files + tree/payload fingerprints).
du-bio = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Encode/decode the persisted DM session key (base64-STANDARD, matching navigator-sync's wire).
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Holds the auth HTTP client (built by navigator-sync::dev_http_client). Pinned to 0.12
# with rustls to match du-atproto / navigator-sync.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `signal`, so the headless realignment harness can cancel through the job's own token on Ctrl-C
# and let it clean up its scratch. Dev-only: the shipped crate does not need it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# Build a synthetic mtDNA FASTA from the bundled rCRS for the import test.
navigator-analysis = { workspace = true }

# `statvfs`, for the realignment preflight's free-space check. Bindings only, no C toolchain — the
# same reason the rest of the workspace is comfortable with `windows`/`objc2` crates elsewhere.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `GetDiskFreeSpaceExW`, the Windows half of the same check — and the half that matters most, since
# Windows is the bulk of the user base and a realignment reserves hundreds of GB. Pure-Rust bindings
# for the same reason as `libc` above, and 0.60 is already in the tree via other dependencies, so
# this pulls in no new crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
